name: 实测记录 / 服务问题
description: 记录可复核的体验与故障
title: "[实测] "
body:
  - type: input
    id: provider
    attributes:
      label: 机场与套餐
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 测试日期、地区、运营商、客户端版本
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: 方法、结果与脱敏证据
      description: 记录时段、节点数量、成功率、延迟或速度；不要上传订阅链接
    validations:
      required: true
