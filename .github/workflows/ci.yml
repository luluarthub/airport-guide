name: Validate catalog
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/catalog.py validate
      - run: python3 scripts/catalog.py generate
      - run: git diff --exit-code -- README.md docs providers reports/catalog.json reports/plans.csv
